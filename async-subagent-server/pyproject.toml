[project]
name = "async-subagent-server-example"
version = "0.1.0"
description = "Self-hosted async subagent server example using deepagents"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.6.8",
    "fastapi>=0.136.3",
    "uvicorn>=0.49.0",
    "langchain-anthropic>=1.4.6",
    "langgraph>=1.2.5",
    "langgraph-sdk>=0.4.2",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "langchain-openai>=1.1.12",
]

[tool.uv.sources]
deepagents = { git = "https://github.com/langchain-ai/deepagents.git", rev = "5200c68cbf67704ae40d53283eefe7f6c8c9d88c", subdirectory = "libs/deepagents" }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
]
